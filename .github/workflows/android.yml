name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          # Set these repo secrets to bake Supabase auth + cloud sync into the
          # APK. Absent, the app runs in local-only demo mode.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional: personal USDA FoodData Central key for dish search
          # (falls back to DEMO_KEY with lower rate limits when unset).
          VITE_USDA_KEY: ${{ secrets.VITE_USDA_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.sha }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk skate.apk

      # The whole point of the committed keystore: this fingerprint must be
      # 9508174620E2A93119C19FA6DBC65640D0E1F2A04E99879AB39E5E443AE7A7F5 on
      # every run, or updates break with "App not installed". (keytool can't
      # read v2-only APK signatures; apksigner can.)
      - name: Verify signing fingerprint
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs skate.apk | tee /tmp/certs.txt
          grep -qi '9508174620e2a93119c19fa6dbc65640d0e1f2a04e99879ab39e5e443ae7a7f5' /tmp/certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: skate-apk
          path: skate.apk

      # Keep a stable download URL: the 'android' release always holds the
      # newest APK. Sideload it once; re-download here for app-shell updates.
      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes || true
          git push --delete origin android || true
          gh release create android skate.apk \
            --title "SkateFit for Android (latest)" \
            --notes "Debug-signed APK built from ${GITHUB_SHA::7}. Download on your phone and open to install (allow installs from your browser when prompted). Tracking runs as a foreground service, so recording continues while the screen is off."
