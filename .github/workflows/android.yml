name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk skate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: skate-apk
          path: skate.apk

      # Keep a stable download URL: the 'android' release always holds the
      # newest APK. Sideload it once; re-download here for app-shell updates.
      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes || true
          git push --delete origin android || true
          gh release create android skate.apk \
            --title "Skate for Android (latest)" \
            --notes "Debug-signed APK built from ${GITHUB_SHA::7}. Download on your phone and open to install (allow installs from your browser when prompted). Tracking runs as a foreground service, so recording continues while the screen is off."
